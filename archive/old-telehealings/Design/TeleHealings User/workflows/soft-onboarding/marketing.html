<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telehealings - Marketing</title>
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/buttons.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <style>
    /* Animation Keyframes */
    @keyframes slideFadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* Marketing Screen Specific Styles */
    .marketing-container {
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      /* Inherits constraints from global.css */
    }



    .marketing-logo-box img {
      width: 120px;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    /* Typography */
    .marketing-title {
      color: #1e5ab8;
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      opacity: 0;
      animation: slideFadeUp 0.6s ease-out 0.1s forwards;
    }

    .marketing-subtitle {
      color: #1e5ab8;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 35px;
      text-align: center;
      opacity: 0;
      animation: slideFadeUp 0.6s ease-out 0.2s forwards;
    }

    /* Features List */
    .features-list {
      position: relative;
      margin-bottom: 40px;
      width: 100%;
      max-width: 300px;
      opacity: 0;
      animation: slideFadeUp 0.6s ease-out 0.3s forwards;
    }

    .feature-item {
      color: #1e5ab8;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 9px;
      position: relative;
      padding-left: 24px;
    }

    .feature-item:last-child {
      margin-bottom: 0;
    }

    /* Star bullets on the feature list */
    .feature-item::before {
      content: '✦';
      position: absolute;
      left: 0;
      top: -1px;
      color: #1e5ab8;
      font-size: 16px;
    }

    /* Stats Row */
    .stats-row {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: space-between;
      max-width: 340px;
      opacity: 0;
      animation: slideFadeUp 0.6s ease-out 0.4s forwards;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px); /* Glassmorphism blur */
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5); /* Subtle glass edge */
      border-radius: 16px;
      padding: 20px 12px;
      flex: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    .stat-box-value {
      color: #1e5ab8;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .stat-box-label {
      color: #55605E;
      font-size: 0.65rem;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0.05em;
    }

    /* Bottom Section */
    .bottom-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 25px 60px 25px;
      background-color: #ffffff;
      opacity: 0;
      animation: slideFadeUp 0.6s ease-out 0.5s forwards;
    }

    .heali-img {
      width: 90px;
      margin-top: auto;
      margin-bottom: 10px;
      animation: float 4s ease-in-out infinite; /* Gentle bobbing */
    }

    .cta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: auto;
    }

    .cta-text {
      color: #1e5ab8;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.5px;
    }
  </style>

</head>
<body>

  <div class="mobile-app-container marketing-container">
    
    <!-- Top Gradient Area -->
    <div class="top-section">
      <div class="marketing-logo-box">
        <img src="../../src/logo.png" alt="Telehealings Logo">
      </div>
      
      <h1 class="marketing-title">Telehealings</h1>
      <h2 class="marketing-subtitle">Continuity-first wellness care platform</h2>
      
      <div class="features-list">
        <div class="feature-item">Ai-powered conversational partner</div>
        <div class="feature-item">Therapist handover continuity</div>
        <div class="feature-item">Self-help library</div>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <span class="stat-box-value">200+</span>
          <span class="stat-box-label">Verified<br>therapists</span>
        </div>
        <div class="stat-box">
          <span class="stat-box-value">8+</span>
          <span class="stat-box-label">Languages<br>&nbsp;</span> <!-- Non-breaking space for height alignment -->
        </div>
        <div class="stat-box">
          <span class="stat-box-value">1,000+</span>
          <span class="stat-box-label">Hours of<br>therapy</span>
        </div>
      </div>
    </div>

    <!-- Bottom White Area with Heali -->
    <div class="bottom-section">
      <img src="../../src/Heali.png" alt="Heali the Penguin" class="heali-img">
      
      <div class="cta-row">
        <p class="cta-text">Your wellness journey<br>is one click away.</p>
        <button class="btn-circle" onclick="window.location.href='./soft-onboarding.html'"> 
          
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </div>

  </div>

</body>
</html>
