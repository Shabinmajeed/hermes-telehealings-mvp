<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telehealings - Login</title>
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/buttons.css">
  <style>
    @keyframes slideFadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-container {
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .top-bg-curve {
      background: linear-gradient(180deg, #cbe0f9 0%, #e2effa 100%);
      border-radius: 0 0 50% 50% / 0 0 25px 25px;
      padding: 48px 20px 30px;
      margin-bottom: 5px;
      animation: slideFadeUp 0.5s ease-out forwards;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }



    .title {
      flex: 1;
      text-align: center;
      color: #1e5ab8;
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #4f6885;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      line-height: 1.4;
      margin: 0;
      padding: 0 10px;
    }

    .form-section {
      flex: 1;
      padding: 12vh 24px 60px 24px;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      overflow-y: auto;
      animation: slideFadeUp 0.5s ease-out forwards;
    }

    .input-group {
      position: relative;
      margin-bottom: 24px;
    }

    .input-label {
      position: absolute;
      top: -8px;
      left: 12px;
      background: #ffffff;
      padding: 0 4px;
      font-size: 12px;
      font-weight: 400;
      color: #64748b;
      z-index: 1;
    }

    .custom-input {
      width: 100%;
      height: 56px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 16px;
      font-size: 16px;
      font-weight: 500;
      color: #1a293b;
      outline: none;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    .custom-input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .custom-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #3b82f6;
    }

    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      cursor: pointer;
      display: flex;
    }

    .forgot-password {
      text-align: right;
      font-size: 13px;
      font-weight: 600;
      color: #387bd5;
      margin-top: -12px;
      margin-bottom: 32px;
      cursor: pointer;
    }

    .divider-text {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      margin-bottom: 30px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
    }

    .social-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .btn-social {
      flex: 1;
      max-width: 140px;
      height: 50px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 25px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 600;
      color: #1a293b;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-social:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .signup-link {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      font-weight: 500;
      margin-top: 32px;
    }

    .signup-link a {
      color: #387bd5;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
  <link rel="stylesheet" href="../../css/overrides.css">
</head>
<body>

  <div class="mobile-app-container login-container">
    
    <!-- Top Curved Section -->
    <div class="top-bg-curve">
      <div class="header-row">
        <div class="back-btn" onclick="window.history.back()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </div>
        <h1 class="title">Welcome Back</h1>
        <div class="header-heali">
          <img src="../../src/Heali.png" alt="Heali Mascot">
        </div>
      </div>
      <p class="subtitle">Log in to continue your wellness journey.</p>
    </div>

    <!-- Form Section -->
    <div class="form-section">
      
      <div class="input-group">
        <label class="input-label">Email or Phone</label>
        <input type="text" class="custom-input" placeholder="Enter your email or phone">
      </div>

      <div class="input-group">
        <label class="input-label">Password</label>
        <input type="password" class="custom-input" id="passwordInput" placeholder="Enter your password">
        <div class="password-toggle" id="togglePassword">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </div>
      </div>

      <div class="forgot-password">Forgot Password?</div>

      <button class="btn-primary" onclick="window.location.href='../../home.html'" style="margin-bottom: 0;">
        Login
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <div class="divider-text">Or login with</div>

      <div class="social-group">
        <!-- Google Button -->
        <button class="btn-social">
          <img src="../../src/google.png" alt="Google" style="width: 18px; height: 18px; object-fit: contain;"> 
          Google
        </button>
        <!-- Apple Button -->
        <button class="btn-social">
          <img src="../../src/apple.png" alt="Apple" style="width: 18px; height: 18px; object-fit: contain;"> 
          Apple
        </button>
      </div>

      <div class="signup-link">
        Don't have an account? <a href="../soft-onboarding/marketing.html">Sign Up</a>
      </div>

    </div>
  </div>

  <script>
    // Toggle Password Visibility
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('passwordInput');

    togglePassword.addEventListener('click', function () {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      if (type === 'text') {
        // Eye-off icon
        this.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
      } else {
        // Eye icon
        this.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      }
    });
  </script>
</body>
</html>
