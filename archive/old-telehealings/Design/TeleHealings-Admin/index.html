<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telehealings - Admin Login</title>
    <!-- Using Inter font to perfectly match the clean sans-serif typography in the design -->
    <link rel="stylesheet" href="./css/global.css">
     
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        html {
            /* Setting a background on the html element prevents the body's background
               from expanding to fill the entire browser viewport. */
            background-color: #e5e5e5; 
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Header & Branding --- */
        .header {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-img {
            width: 90px;
            height: 90px;
            margin-bottom: 12px;
        }

        .brand-title {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
            color: #0745b1;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 14px;
            font-weight: 500;
            color: #144db9;
            margin-bottom: 35px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
            color: #4b4b4b;
            margin-bottom: 25px;
            text-align: center;
        }

        /* --- Login Card Container --- */
        .login-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 0 auto 40px;
        }

        .penguin-mascot {
            position: absolute;
            top: -170px;
            right: -150px;
            width: 300px;
            height: auto;
            z-index: 0;
            /* Fallback style in case the image fails to load */
            font-size: 60px;
            line-height: 1;
        }

        .login-card {
            position: relative;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-body {
            padding: 35px 35px 25px 35px;
        }

        /* --- Form Inputs --- */
        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #000;
        }

        .input-icon.password-icon {
            color: #a8a8a8;
        }

        .form-control {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background-color: #e8e8e8;
            border: 1px solid #999999;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: #000000;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #2b74d4;
        }

        .form-control::placeholder {
            color: #a8a8a8;
            font-weight: 500;
        }

        /* --- Actions & Links --- */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background-color: #2a73d4;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 25px;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #2361b5;
        }

        .links-container {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
        }

        .links-container a {
            color: #2a73d4;
            text-decoration: none;
        }

        .links-container a:hover {
            text-decoration: underline;
        }

        .help-text {
            margin-top: 20px;
            color: #000000;
        }

        /* --- Card Footer --- */
        .card-footer {
            background-color: #e5e4df;
            padding: 22px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Telehealings Logo -->
        <img src="./src/Logo.png" alt="Telehealings Logo" class="logo-img">
        
        <h1 class="brand-title">Telehealings</h1>
        <p class="brand-subtitle">Continuity-First Wellness Care Platform</p>

        <h2 class="page-title">Admin Login</h2>
    </div>

    <div class="login-wrapper">
        <!-- Penguin Mascot (Replace src with actual image path if available) -->
        <img src="./src/Heali-peak.png" alt="Penguin Mascot" class="penguin-mascot">
        
        <div class="login-card">
            <div class="card-body">
                <div class="input-group">
                    <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <input type="email" class="form-control" value="ajeshanand@telehealings.com" placeholder="Email Address">
                </div>
                
                <div class="input-group">
                    <svg class="input-icon password-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="14" height="10" x="5" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0110 0v4"></path><circle cx="12" cy="16" r="1"></circle></svg>
                    <input type="password" class="form-control" placeholder="Password">
                </div>

                <button class="btn-primary" onclick="window.location.href='./home.html'">Log In</button>

                <div class="links-container">
                    <a href="#">Forgot Password?</a>
                </div>
            </div>
            <div class="card-footer">
                Have issues Sign In ? <a href="#" style="color: #2a73d4; text-decoration: none;">Contact Tech Team</a>
            </div>
        </div>
    </div>

</body>
</html>
