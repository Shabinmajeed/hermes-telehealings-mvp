<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telehealings Sidebar</title>
    <style>
        /* ==========================================================================
           INLINED COMPONENT CSS TO PREVENT RELATIVE PATH ERRORS ACROSS FOLDERS
           ========================================================================== */
        .sidebar {
            width: 260px;
            height: var(--viewport-height, 100%); 
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(0,0,0,0.05);
            background: #ffffff;
            box-sizing: border-box;
            position: relative; 
            flex-shrink: 0; 
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        .brand img {
            width: 45px;
            height: 45px;
        }
        .brand span {
            font-size: 20px;
            font-weight: 700;
            color: #000;
        }
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        .search-box svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #64748b;
        }
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;      
            overflow-y: auto;   
            height: auto !important; 
            margin-bottom: 25px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: #475569;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s;
        }
        .nav-item:hover {
            background: #f1f5f9;
            color: #0f172a;
        }
        .nav-item.active {
            background: #1c52b8;
            color: #fff;
        }
        .nav-item svg {
            width: 20px;
            height: 20px;
            color: #64748b;
            flex-shrink: 0;
        }
        .nav-item.active svg {
            color: #fff;
        }
        .badge {
            margin-left: auto;
            background: #f04438;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 700;
        }
        .nav-separator {
            height: 1px;
            background-color: #e2e8f0;
            margin: 8px 16px;
            flex-shrink: 0;
        }
        .user-profile {
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: auto; 
            border: 1px solid #f1f5f9;
            cursor: pointer;
            position: relative;
            outline: none;
        }
        .user-profile img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            margin-top: -45px;
            margin-bottom: 10px;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            background-color: #ffffff;
        }
        .user-profile h4 {
            font-size: 14px;
            margin: 0 0 2px 0;
            color: #0f172a;
        }
        .user-profile p {
            font-size: 12px;
            color: #64748b;
            margin: 0;
        }
        .profile-dropdown {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            flex-direction: column;
            padding: 8px 0;
            z-index: 1000;
        }
        .user-profile:focus .profile-dropdown,
        .user-profile:focus-within .profile-dropdown {
            display: flex;
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            color: #475569;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            text-align: left;
        }
        .dropdown-item:hover {
            background: #f8fafc;
            color: #0f172a;
        }
        .dropdown-divider {
            height: 1px;
            background-color: #f1f5f9;
            margin: 4px 0;
        }
        .logout-item {
            color: #e11d48;
        }
        .logout-item:hover {
            background: #fff1f2;
            color: #be123c;
        }

        /* Sidebar Toggle Transitions & Collapsed State */
        .sidebar {
            transition: width 0.3s ease, padding 0.3s ease;
        }
        .sidebar-toggle-btn {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .sidebar-toggle-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }
        .sidebar-toggle-btn svg {
            transition: transform 0.3s ease;
        }

        /* Collapsed Mode */
        .sidebar.collapsed {
            width: 88px;
            padding: 30px 10px;
        }
        .sidebar.collapsed .nav-text,
        .sidebar.collapsed .badge,
        .sidebar.collapsed .user-profile h4,
        .sidebar.collapsed .user-profile p {
            display: none;
        }
        .sidebar.collapsed .brand {
            flex-direction: row !important;
            padding: 0 !important;
            justify-content: center !important;
            gap: 4px;
            align-items: center;
            margin-bottom: 30px;
        }
        .sidebar.collapsed .brand-left span {
            display: none;
        }
        .sidebar.collapsed .sidebar-toggle-btn svg {
            transform: rotate(180deg);
        }
        .sidebar.collapsed .search-box input {
            display: none;
        }
        .sidebar.collapsed .search-box {
            width: 40px;
            height: 40px;
            background: #f8fafc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            cursor: pointer;
        }
        .sidebar.collapsed .search-box svg {
            position: static;
            transform: none;
        }
        .sidebar.collapsed .nav-item {
            padding: 12px;
            justify-content: center;
        }
        .sidebar.collapsed .nav-item svg {
            margin: 0;
        }
        .sidebar.collapsed .user-profile {
            padding: 10px;
            background: transparent;
            box-shadow: none;
            border: none;
        }
        .sidebar.collapsed .user-profile img {
            margin-top: 0;
            margin-bottom: 0;
            width: 40px;
            height: 40px;
            border: none;
            box-shadow: none;
            background-color: transparent;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.querySelector('.sidebar');
            if (sidebarToggle && sidebar) {
                sidebarToggle.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                });
            }
        });
    </script>
