<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telehealings - Video Session</title>
  <link rel="stylesheet" href="../../css/global.css">
  <style>
    .session-container {
      background-color: #1e293b; /* Dark bg for video */
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    
    @keyframes slideFadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Video Backgrounds */
    .remote-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Top Bar Overlay */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 40px 24px 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
    }

    .therapist-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .therapist-name {
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .session-timer {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 20px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .session-timer::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Local Video PiP */
    .local-video-container {
      position: absolute;
      top: 100px;
      right: 20px;
      width: 100px;
      height: 140px;
      border-radius: 16px;
      overflow: hidden;
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      border: 2px solid rgba(255,255,255,0.2);
      transition: background 0.2s ease;
    }

    .local-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror effect */
      transition: opacity 0.2s ease;
    }

    /* Bottom Controls */
    .controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 30px 24px 40px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 10;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
    }

    .control-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .control-btn.off {
      background: #f8fafc;
      color: #1e293b;
    }

    .control-btn.end-call {
      background: #ef4444;
      border-color: #ef4444;
    }

    .control-btn:active {
      transform: scale(0.92);
    }

    .control-btn svg {
      width: 24px;
      height: 24px;
    }

    /* Session Chat Panel */
    .session-chat-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 120px; /* Stop above the control bar */
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }

    .session-chat-panel {
      background: #ffffff;
      height: 60vh;
      border-radius: 24px;
      margin: 0 16px;
      display: flex;
      flex-direction: column;
      transform: translateY(120%);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      pointer-events: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    }

    .session-chat-overlay.open .session-chat-panel {
      transform: translateY(0);
    }

    .chat-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
    }

    .chat-header-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a293b;
    }

    .chat-close-btn {
      color: #64748b;
      cursor: pointer;
      display: flex;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #f8fafc;
    }

    .chat-messages::-webkit-scrollbar {
      display: none;
    }

    .msg-bubble-wrap {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: slideFadeUp 0.3s ease-out forwards;
    }

    .msg-bubble-wrap.remote {
      align-self: flex-start;
    }

    .msg-bubble-wrap.local {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .msg-bubble-wrap.remote .msg-bubble {
      background: #ffffff;
      color: #334155;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .msg-bubble-wrap.local .msg-bubble {
      background: #387bd5;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 6px;
      padding: 0 4px;
      font-weight: 500;
    }

    .chat-input-area {
      padding: 16px;
      background: #ffffff;
      border-top: 1px solid #f1f5f9;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
    }

    .chat-input {
      flex: 1;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 12px 16px;
      font-size: 14px;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 100px;
      font-family: inherit;
      color: #1a293b;
    }

    .chat-send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #387bd5;
      color: #ffffff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .chat-send-btn:active {
      transform: scale(0.95);
    }
  </style>
  <link rel="stylesheet" href="../../css/overrides.css">
</head>
<body>

  <div class="mobile-app-container session-container">
    
    <!-- Therapist Video (Remote) -->
    <img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&w=800&q=80" alt="Therapist Video" class="remote-video">

    <!-- Top Overlay -->
    <div class="top-bar">
      <div class="therapist-info">
        <span class="therapist-name">Dr. John .D</span>
      </div>
      <div class="session-timer" id="sessionTimer">45:00</div>
    </div>

    <!-- Local Video (User) -->
    <div class="local-video-container">
      <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=400&q=80" alt="Local Video" class="local-video" id="localVideo">
    </div>

    <!-- Chat Overlay Panel -->
    <div class="session-chat-overlay" id="sessionChatOverlay">
      <div class="session-chat-panel" onclick="event.stopPropagation()">
        <div class="chat-header">
          <div class="chat-header-title">Chat with Dr. John</div>
          <div class="chat-close-btn" id="closeChatBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </div>
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="msg-bubble-wrap remote">
            <div class="msg-bubble">Hi Ajesh! I'm here. Let me know when you're ready to start.</div>
            <div class="msg-time">Just now</div>
          </div>
        </div>
        <div class="chat-input-area">
          <textarea class="chat-input" id="chatInput" placeholder="Type a message..." rows="1"></textarea>
          <button class="chat-send-btn" id="sendChatBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="controls-bar">
      <!-- Mute/Unmute -->
      <button class="control-btn" id="micToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-on">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>

      <!-- Video On/Off -->
      <button class="control-btn" id="camToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-on">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
      </button>

      <!-- Chat -->
      <button class="control-btn" id="chatToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
      </button>

      <!-- End Call -->
      <button class="control-btn end-call" onclick="window.location.href='./session-feedback.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path>
          <line x1="23" y1="1" x2="1" y2="23"></line>
        </svg>
      </button>
    </div>
  </div>

  <script>
    // Timer Logic (Countdown from 45:00)
    let timeLeft = 45 * 60; // 45 minutes in seconds
    const timerDisplay = document.getElementById('sessionTimer');

    setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }
    }, 1000);

    // Toggles
    const micToggle = document.getElementById('micToggle');
    const camToggle = document.getElementById('camToggle');
    const localVideo = document.getElementById('localVideo');
    
    const icons = {
      micOn: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line>',
      micOff: '<line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line>',
      camOn: '<polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>',
      camOff: '<line x1="1" y1="1" x2="23" y2="23"></line><path d="M21 21H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3m3-3h6l2 3h4a2 2 0 0 1 2 2v9.34m-7.72-2.06a4 4 0 1 1-5.56-5.56"></path>'
    };

    micToggle.addEventListener('click', function() {
      this.classList.toggle('off');
      const svg = this.querySelector('svg');
      svg.innerHTML = this.classList.contains('off') ? icons.micOff : icons.micOn;
    });

    camToggle.addEventListener('click', function() {
      this.classList.toggle('off');
      const svg = this.querySelector('svg');
      svg.innerHTML = this.classList.contains('off') ? icons.camOff : icons.camOn;
      
      // Simulate turning the camera feed off visually
      if (this.classList.contains('off')) {
        localVideo.style.opacity = '0';
        localVideo.parentElement.style.background = '#334155'; // dark slate bg when off
      } else {
        localVideo.style.opacity = '1';
        localVideo.parentElement.style.background = 'transparent';
      }
    });

    // Chat Overlay Logic
    const chatToggleBtn = document.getElementById('chatToggle');
    const sessionChatOverlay = document.getElementById('sessionChatOverlay');
    const closeChatBtn = document.getElementById('closeChatBtn');
    
    // Toggle chat
    chatToggleBtn.addEventListener('click', function() {
      sessionChatOverlay.classList.toggle('open');
      this.classList.toggle('off');
    });

    closeChatBtn.addEventListener('click', () => {
      sessionChatOverlay.classList.remove('open');
      chatToggleBtn.classList.remove('off');
    });

    // Send Message Logic
    const chatInput = document.getElementById('chatInput');
    const sendChatBtn = document.getElementById('sendChatBtn');
    const chatMessages = document.getElementById('chatMessages');

    function sendSessionMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      
      const msgHtml = `
        <div class="msg-bubble-wrap local">
          <div class="msg-bubble">${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
          <div class="msg-time">Just now</div>
        </div>
      `;
      chatMessages.insertAdjacentHTML('beforeend', msgHtml);
      chatInput.value = '';
      chatInput.style.height = '44px'; // Reset height
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    sendChatBtn.addEventListener('click', sendSessionMessage);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendSessionMessage();
      }
    });

    chatInput.addEventListener('input', function() {
      this.style.height = '44px';
      this.style.height = (this.scrollHeight) + 'px';
      if(this.value === '') this.style.height = '44px';
    });
  </script>
</body>
</html>
