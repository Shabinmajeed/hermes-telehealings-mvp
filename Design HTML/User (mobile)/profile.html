<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telehealings - Profile</title>
  <link rel="stylesheet" href="./css/global.css">
  <style>
    /* Animation Keyframes */
    @keyframes slideFadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Screen Container */
    .profile-container {
      background-color: #fbfcfd;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Content Wrapper */
    .content-wrapper {
      position: relative;
      z-index: 1;
      padding: 10px 20px 120px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Header Top Row */
    .header-top {
      position: relative;
      z-index: 1;
      margin: 0;
    }

    .header-top h1 {
      font-size: 28px;
      font-weight: 800;
      color: #000;
      margin: 0 0 4px 0;
      letter-spacing: -0.5px;
    }

    .header-top p {
      font-size: 13px;
      font-weight: 500;
      color: #4b6380;
      margin: 0;
    }

    /* Profile Header Card */
    .profile-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      border: 1px solid #f1f5f9;
      margin-bottom: 24px;
      animation: slideFadeUp 0.5s ease-out forwards;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid #e2effb;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .profile-name {
      font-size: 22px;
      font-weight: 700;
      color: #1a293b;
      margin-bottom: 4px;
    }

    .profile-email {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .edit-profile-btn {
      background: #f8fafc;
      color: #387bd5;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 8px 24px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .edit-profile-btn:active {
      background: #f1f5f9;
      transform: scale(0.96);
    }

    /* Settings List Group */
    .settings-group {
      background: #ffffff;
      border-radius: 24px;
      padding: 8px 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
      border: 1px solid #f1f5f9;
      margin-bottom: 24px;
      animation: slideFadeUp 0.5s ease-out 0.1s forwards;
      opacity: 0;
    }

    .settings-group:nth-child(3) { animation-delay: 0.2s; }
    .settings-group:nth-child(4) { animation-delay: 0.3s; }

    .settings-item {
      display: flex;
      align-items: center;
      padding: 16px 8px;
      border-bottom: 1px solid #f8fafc;
      cursor: pointer;
      transition: background 0.2s, border-radius 0.2s;
    }

    .settings-item:last-child {
      border-bottom: none;
    }

    .settings-item:active {
      background: #f8fafc;
      border-radius: 12px;
    }

    .settings-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #f4f8fd;
      color: #387bd5;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 16px;
      flex-shrink: 0;
    }

    .settings-text {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: #1a293b;
    }

    .chevron {
      color: #cbd5e1;
    }

    .logout-item .settings-text {
      color: #ef4444;
    }

    .logout-item .settings-icon {
      background: #fef2f2;
      color: #ef4444;
    }
  </style>
  <link rel="stylesheet" href="./css/overrides.css">
</head>
<body>

  <div class="mobile-app-container profile-container">
    
    <!-- Fixed Sticky Header -->
    <div class="fixed-header">
      <div class="header-top">
        <h1>Profile</h1>
        <p>Manage your account and preferences.</p>
      </div>
    </div>

    <!-- Main Scrollable Content -->
    <div class="content-wrapper">
      
      <!-- Profile Info Card -->
      <div class="profile-card">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Ajesh Anand" class="profile-avatar">
        <div class="profile-name">Ajesh Anand</div>
        <div class="profile-email">ajesh.anand@example.com</div>
        <button class="edit-profile-btn" onclick="window.location.href='./workflows/user-registration/profile-completion.html'">Edit Profile</button>
      </div>

      <!-- General Settings -->
      <div class="settings-group">
        <div class="settings-item">
          <div class="settings-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </div>
          <div class="settings-text">Personal Details</div>
          <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
        <div class="settings-item" onclick="window.location.href='./workflows/medical-profile/medical-profile-1.html'">
          <div class="settings-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
          </div>
          <div class="settings-text">Medical Profile</div>
          <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
        <div class="settings-item">
          <div class="settings-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
          </div>
          <div class="settings-text">Payment Methods</div>
          <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </div>

      <!-- Preferences Settings -->
      <div class="settings-group">
        <div class="settings-item">
          <div class="settings-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </div>
          <div class="settings-text">Change Password</div>
          <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
        <div class="settings-item">
          <div class="settings-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          </div>
          <div class="settings-text">Security & Privacy</div>
          <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </div>

      <!-- Logout Area -->
      <div class="settings-group">
        <div class="settings-item logout-item" onclick="window.location.href='./workflows/login/login.html'">
          <div class="settings-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </div>
          <div class="settings-text">Log out</div>
        </div>
      </div>

    </div>

    <!-- Bottom Navigation Placeholder -->
    <div id="bottom-nav-placeholder"></div>

  </div>

  <!-- Inject Shared Scripts -->
  <script src="./js/bottom-nav.js"></script>
  <script src="./js/heali-chat.js"></script>

</body>
</html>
