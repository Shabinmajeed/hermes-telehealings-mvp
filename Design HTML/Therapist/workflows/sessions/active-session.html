<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telehealings - Live Session</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Global Styles -->
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/sessions.css">

    <style>
        /* Styles for collapsible notes area */
        .notes-area {
            transition: width 0.3s ease, padding 0.3s ease;
        }
        .notes-area.collapsed {
            width: 72px; /* Slim width when collapsed */
            padding: 24px 12px;
        }
        .notes-area.collapsed .notes-title,
        .notes-area.collapsed .notes-input,
        .notes-area.collapsed .btn-primary {
            display: none; /* Hide contents cleanly */
        }
        .notes-header {
            justify-content: space-between;
            width: 100%;
        }
        .notes-area.collapsed .notes-header {
            flex-direction: column;
            justify-content: flex-start;
            gap: 24px;
        }
        #toggleNotesBtn {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        #toggleNotesBtn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }
        #toggleNotesBtn svg {
            transition: transform 0.3s ease;
        }
        .notes-area.collapsed #toggleNotesBtn svg {
            transform: rotate(180deg); /* Flip the arrow when collapsed */
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        
        <!-- Sidebar injection placeholder -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content">
            
            <header class="top-header">
                <div class="header-title">
                    <h1>Session with Sarah Jenkins</h1>
                    <p><span class="live-indicator"></span> 14:22 elapsed</p>
                </div>
            </header>

            <div class="session-container">
                
                <!-- Left: Main Session Column (Video + Chat) -->
                <div class="main-session-column" style="display: flex; flex-direction: column; flex-grow: 1; gap: 24px; min-width: 0; overflow: hidden;">
                    <!-- Active Video Call Area -->
                    <div class="video-area" style="flex-grow: 1; min-height: 0;">
                    <!-- Placeholder for the Patient's Camera using Unsplash -->
                    <img src="../../assets/icons/user-call.png" alt="Patient Video" class="main-video">
                    
                    <div class="participant-name">Sarah Jenkins</div>
                    
                    <!-- Picture-in-Picture for Therapist Camera -->
                    <div class="pip-video">
                        <img id="therapistVideoImg" src="../../assets/icons/therapist-call.png" alt="Therapist Video" style="transition: filter 0.3s ease;">
                        <div id="cameraOffOverlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); color: white; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; gap: 8px;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            Camera Off
                        </div>
                    </div>
                    
                    <!-- Floating Controls -->
                    <div class="video-controls">
                        <button class="control-btn" id="toggleMuteBtn" title="Mute Microphone">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                        </button>
                        <button class="control-btn" id="toggleCameraBtn" title="Turn Off Camera">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                        </button>
                        <button class="control-btn" id="toggleChatBtn" title="Open Chat">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        </button>
                        <button class="control-btn btn-end-call" title="End Call" onclick="window.location.href='./session-summary.html'">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg>
                        </button>
                    </div>
                </div>

                <!-- In-Session Chat Area (Hidden by default) -->
                <div class="session-chat-area" id="sessionChatArea" style="display: none; height: 35%; background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.03); flex-direction: column; flex-shrink: 0; overflow: hidden;">
                    <div style="padding: 16px 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
                        <h3 style="margin: 0; font-size: 16px; color: #0f172a; display: flex; align-items: center; gap: 8px;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                            Session Chat
                        </h3>
                        <button id="closeChatBtn" style="background: transparent; border: none; cursor: pointer; color: #64748b; padding: 4px; border-radius: 6px; display: flex; transition: color 0.2s, background 0.2s;" onmouseover="this.style.background='#f1f5f9'; this.style.color='#0f172a'" onmouseout="this.style.background='transparent'; this.style.color='#64748b'">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                    <div style="flex-grow: 1; padding: 20px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 16px;">
                        <div style="align-self: flex-start; background: #ffffff; border: 1px solid #e2e8f0; padding: 10px 14px; border-radius: 16px; border-bottom-left-radius: 4px; font-size: 14px; color: #0f172a; box-shadow: 0 1px 2px rgba(0,0,0,0.02);">
                            <p style="margin: 0;">Hi Dr. Anand, can you see my screen?</p>
                            <span style="font-size: 11px; color: #94a3b8; display: block; margin-top: 4px;">14:15</span>
                        </div>
                        <div style="align-self: flex-end; background: var(--color-primary, #2a73d4); color: #ffffff; padding: 10px 14px; border-radius: 16px; border-bottom-right-radius: 4px; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.02);">
                            <p style="margin: 0;">Yes, it looks good.</p>
                            <span style="font-size: 11px; color: #bfdbfe; display: block; margin-top: 4px; text-align: right;">14:16</span>
                        </div>
                    </div>
                    <div style="padding: 16px 20px; border-top: 1px solid #f1f5f9; display: flex; gap: 12px; align-items: center; background: #ffffff;">
                        <input type="text" placeholder="Type a message..." style="flex-grow: 1; padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 20px; outline: none; font-size: 14px; font-family: inherit;">
                        <button style="background: var(--color-primary, #2a73d4); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>

                <!-- Right: Session Notes Panel -->
                <div class="notes-area">
                    <div class="notes-header">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            <span class="notes-title">Session Notes</span>
                        </div>
                        <button id="toggleNotesBtn" title="Toggle Notes">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </button>
                    </div>
                    
                    <textarea class="notes-input" placeholder="Type your observations and clinical notes here. These will be saved securely to the client's file..."></textarea>
                    
                    <button class="btn-primary" style="background-color: var(--color-primary, #2a73d4); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s;">
                        Save Notes
                    </button>
                </div>

            </div>
        </main>
    </div>

    <script>
        // Fetch and inject the sidebar
        fetch('../../Components/side-bar.html')
            .then(response => response.text())
            .then(data => {
                // Dynamically adjust all root-relative paths for this nested file structure
                const adjustedData = data.replace(/href="\.\//g, 'href="../../').replace(/src="\.\//g, 'src="../../');
                document.getElementById('sidebar-container').outerHTML = adjustedData;
                setTimeout(() => {
                    const navItems = document.querySelectorAll('.nav-item');
                    navItems.forEach(item => item.classList.remove('active'));
                    // Selects the fifth item (Sessions)
                    if(navItems.length > 4) {
                        navItems[4].classList.add('active');
                    }
                }, 50);
                
                // Sidebar Toggle Logic
                const sidebar = document.querySelector('.sidebar');
                const toggleBtn = document.getElementById('sidebarToggle');
                if (sidebar && toggleBtn) {
                    // Restore state from LocalStorage
                    if (localStorage.getItem('sidebarCollapsed') === 'true') {
                        sidebar.classList.add('collapsed');
                    }
                    toggleBtn.addEventListener('click', () => {
                        sidebar.classList.toggle('collapsed');
                        localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
                    });
                }
            })
            .catch(error => console.error('Error loading the sidebar:', error));

        // Toggle Notes Panel
        document.addEventListener('DOMContentLoaded', () => {
            const toggleNotesBtn = document.getElementById('toggleNotesBtn');
            const notesArea = document.querySelector('.notes-area');
            
            toggleNotesBtn.addEventListener('click', () => {
                notesArea.classList.toggle('collapsed');
            });
        });

        // Session Chat Toggle Logic
        document.addEventListener('DOMContentLoaded', () => {
            const toggleChatBtn = document.getElementById('toggleChatBtn');
            const closeChatBtn = document.getElementById('closeChatBtn');
            const sessionChatArea = document.getElementById('sessionChatArea');
            
            const toggleChat = () => {
                sessionChatArea.style.display = sessionChatArea.style.display === 'none' ? 'flex' : 'none';
            };
            
            toggleChatBtn.addEventListener('click', toggleChat);
            closeChatBtn.addEventListener('click', toggleChat);
        });

        // Mute Microphone Toggle Logic
        document.addEventListener('DOMContentLoaded', () => {
            const toggleMuteBtn = document.getElementById('toggleMuteBtn');
            let isMuted = false;
            
            toggleMuteBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                if (isMuted) {
                    toggleMuteBtn.style.background = '#ef4444'; // Red background
                    toggleMuteBtn.title = 'Unmute Microphone';
                    toggleMuteBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
                } else {
                    toggleMuteBtn.style.background = 'rgba(255, 255, 255, 0.1)'; // Restore original semi-transparent background
                    toggleMuteBtn.title = 'Mute Microphone';
                    toggleMuteBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
                }
            });
        });

        // Turn Off Camera Toggle Logic
        document.addEventListener('DOMContentLoaded', () => {
            const toggleCameraBtn = document.getElementById('toggleCameraBtn');
            const therapistVideoImg = document.getElementById('therapistVideoImg');
            const cameraOffOverlay = document.getElementById('cameraOffOverlay');
            let isCameraOff = false;
            
            toggleCameraBtn.addEventListener('click', () => {
                isCameraOff = !isCameraOff;
                if (isCameraOff) {
                    toggleCameraBtn.style.background = '#ef4444'; // Red background
                    toggleCameraBtn.title = 'Turn On Camera';
                    toggleCameraBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
                    therapistVideoImg.style.filter = 'blur(8px)';
                    cameraOffOverlay.style.display = 'flex';
                } else {
                    toggleCameraBtn.style.background = 'rgba(255, 255, 255, 0.1)'; // Restore original semi-transparent background
                    toggleCameraBtn.title = 'Turn Off Camera';
                    toggleCameraBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>';
                    therapistVideoImg.style.filter = 'none';
                    cameraOffOverlay.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
